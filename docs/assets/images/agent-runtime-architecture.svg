<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Agents-Flex 现代 Agent 运行时架构</title>
  <desc id="desc">业务配置、AgentLoader、调用上下文、中间件、Runner、Worker、持久化 Store、实时事件和大型结果存储之间的关系。</desc>
  <style>
    text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; letter-spacing: 0; }
    .title { font-size: 28px; font-weight: 700; }
    .section { font-size: 18px; font-weight: 700; }
    .name { font-size: 16px; font-weight: 700; }
    .detail { font-size: 13px; fill: #4b5568; }
    .box { stroke-width: 2; rx: 8; }
    .arrow { fill: none; stroke: #667085; stroke-width: 2.1; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8291a8; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f7f9fc"/>
  <text x="60" y="48" class="title">Agent 现代运行时架构</text>

  <text x="60" y="86" class="section">定义与调用输入</text>
  <rect x="60" y="103" width="330" height="142" class="box" fill="#fff4df" stroke="#c9892b"/>
  <text x="86" y="138" class="name">平台控制面</text>
  <text x="86" y="166" class="detail">配置版本、发布、权限、适用场景</text>
  <text x="86" y="190" class="detail">参数校验、审计、报表与推荐策略</text>
  <text x="86" y="214" class="detail">生成可执行的 Agent 定义和 RunOptions</text>

  <rect x="435" y="103" width="330" height="142" class="box" fill="#e9f2ff" stroke="#4d8bd8"/>
  <text x="461" y="138" class="name">业务配置与 AgentLoader</text>
  <text x="461" y="166" class="detail">业务表、配置中心或远程配置服务</text>
  <text x="461" y="190" class="detail">按 agentId + version 加载和组装</text>
  <text x="461" y="214" class="detail">框架不限定配置模型和存储结构</text>

  <rect x="810" y="103" width="330" height="142" class="box" fill="#f4edff" stroke="#8557c8"/>
  <text x="836" y="138" class="name">AgentInvocationContext</text>
  <text x="836" y="166" class="detail">tenant / user / session / request</text>
  <text x="836" y="190" class="detail">流式开关、类型化进程内服务</text>
  <text x="836" y="214" class="detail">仅随当前调用传递，不进入 Snapshot</text>

  <text x="60" y="292" class="section">执行、扩展与调度</text>
  <rect x="60" y="310" width="330" height="164" class="box" fill="#eaf8f1" stroke="#35966f"/>
  <text x="86" y="345" class="name">AgentRunner</text>
  <text x="86" y="373" class="detail">状态机、Snapshot、恢复、重试、预算</text>
  <text x="86" y="397" class="detail">模型流、工具协议、审批、父子 Run</text>
  <text x="86" y="421" class="detail">上下文压缩、大型结果外置</text>
  <text x="86" y="445" class="detail">持久化事件与实时事件发布</text>

  <rect x="435" y="310" width="330" height="164" class="box" fill="#edf7ff" stroke="#4d8bd8"/>
  <text x="461" y="345" class="name">Agent Middleware</text>
  <text x="461" y="373" class="detail">aroundStep → aroundModelCall</text>
  <text x="461" y="397" class="detail">aroundToolCall → ToolInterceptor → Tool</text>
  <text x="461" y="421" class="detail">权限、缓存、限流、Prompt 处理、短路</text>
  <text x="461" y="445" class="detail">读取 Run 与 Invocation Context</text>

  <rect x="810" y="310" width="330" height="164" class="box" fill="#fff0f0" stroke="#c45b5b"/>
  <text x="836" y="345" class="name">AgentWorker / Command Inbox</text>
  <text x="836" y="373" class="detail">持久化 Command 提交、租约领取、ack</text>
  <text x="836" y="397" class="detail">事件唤醒 + 定时轮询兜底</text>
  <text x="836" y="421" class="detail">Run Lease、续租、崩溃接管</text>
  <text x="836" y="445" class="detail">任务计划与子 Agent 调度</text>

  <text x="60" y="522" class="section">状态、解析、内容与观测</text>
  <rect x="60" y="540" width="245" height="130" class="box" fill="#ffffff" stroke="#7d8ba0"/>
  <text x="84" y="574" class="name">AgentRunStore</text>
  <text x="84" y="602" class="detail">Snapshot、CAS、Lease</text>
  <text x="84" y="626" class="detail">pending Tool、预算、等待状态</text>
  <text x="84" y="650" class="detail">跨进程恢复事实来源</text>

  <rect x="330" y="540" width="245" height="130" class="box" fill="#ffffff" stroke="#7d8ba0"/>
  <text x="354" y="574" class="name">Command Store</text>
  <text x="354" y="602" class="detail">commandId 幂等提交</text>
  <text x="354" y="626" class="detail">Command Lease、attempts</text>
  <text x="354" y="650" class="detail">审批、输入与恢复动作</text>

  <rect x="600" y="540" width="245" height="130" class="box" fill="#ffffff" stroke="#7d8ba0"/>
  <text x="624" y="574" class="name">AgentLoader</text>
  <text x="624" y="602" class="detail">agentId + version 按需加载</text>
  <text x="624" y="626" class="detail">组装模型、工具与策略</text>
  <text x="624" y="650" class="detail">跨进程重建 Agent 与 Tool</text>

  <rect x="870" y="540" width="270" height="130" class="box" fill="#ffffff" stroke="#7d8ba0"/>
  <text x="894" y="574" class="name">Artifact Store</text>
  <text x="894" y="602" class="detail">大型工具结果原文</text>
  <text x="894" y="626" class="detail">artifactId、size、checksum</text>
  <text x="894" y="650" class="detail">独立鉴权和生命周期</text>

  <rect x="195" y="710" width="360" height="112" class="box" fill="#eef8ff" stroke="#4d8bd8"/>
  <text x="221" y="744" class="name">AgentRuntimeEventStream</text>
  <text x="221" y="772" class="detail">模型文本 / reasoning / ToolCall delta</text>
  <text x="221" y="796" class="detail">工具进度、命令、压缩与外置实时事件</text>

  <rect x="645" y="710" width="360" height="112" class="box" fill="#fff7e8" stroke="#c9892b"/>
  <text x="671" y="744" class="name">AgentRunEventStore</text>
  <text x="671" y="772" class="detail">持久化生命周期事件、Run 内 sequence</text>
  <text x="671" y="796" class="detail">审计、报表、断点消费与 Outbox 集成</text>

  <path d="M 390 174 L 435 174" class="arrow"/>
  <path d="M 600 245 L 722 540" class="dash"/>
  <path d="M 765 174 L 810 174" class="dash"/>
  <path d="M 600 245 L 250 310" class="arrow"/>
  <path d="M 975 245 L 650 310" class="dash"/>
  <path d="M 390 392 L 435 392" class="arrow"/>
  <path d="M 765 392 L 810 392" class="arrow"/>
  <path d="M 190 474 L 182 540" class="arrow"/>
  <path d="M 300 474 L 452 540" class="dash"/>
  <path d="M 560 474 L 722 540" class="dash"/>
  <path d="M 700 474 L 1005 540" class="dash"/>
  <path d="M 300 670 L 375 710" class="arrow"/>
  <path d="M 840 670 L 825 710" class="arrow"/>

  <text x="60" y="870" class="detail">可恢复状态、非持久化调用上下文、高频实时事件和大型内容分别管理，平台可替换各 Store 而不改变 Agent 执行契约。</text>
</svg>
