<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">AgentTurn lifecycle</title>
  <desc id="desc">Fixed model and tool phases with blocked and terminal turn states.</desc>
  <style>
    text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .title { font-size: 28px; font-weight: 700; }
    .name { font-size: 17px; font-weight: 700; }
    .detail { font-size: 14px; fill: #4b5568; }
    .state { stroke-width: 2; rx: 8; }
    .arrow { fill: none; stroke: #667085; stroke-width: 2.2; marker-end: url(#arrow); }
    .dash { fill: none; stroke: #8c6bb1; stroke-width: 2; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/>
    </marker>
  </defs>
  <rect width="1200" height="650" fill="#f7f9fc"/>
  <text x="55" y="52" class="title">AgentTurn 固定执行阶段与生命周期状态</text>

  <rect x="55" y="105" width="180" height="90" class="state" fill="#e9f2ff" stroke="#4d8bd8"/>
  <text x="110" y="143" class="name">READY</text>
  <text x="85" y="170" class="detail">已创建，尚未执行</text>

  <rect x="315" y="105" width="210" height="90" class="state" fill="#eaf8f1" stroke="#35966f"/>
  <text x="377" y="143" class="name">MODEL</text>
  <text x="348" y="170" class="detail">调用模型并保存消息</text>

  <rect x="605" y="105" width="210" height="90" class="state" fill="#fff4df" stroke="#c9892b"/>
  <text x="674" y="143" class="name">TOOLS</text>
  <text x="634" y="170" class="detail">审批并执行 ToolCall</text>

  <rect x="895" y="105" width="250" height="90" class="state" fill="#eaf8f1" stroke="#35966f"/>
  <text x="962" y="143" class="name">COMPLETED</text>
  <text x="932" y="170" class="detail">模型返回最终消息</text>

  <path d="M 235 150 L 315 150" class="arrow"/>
  <path d="M 525 150 L 605 150" class="arrow"/>
  <path d="M 815 135 C 850 90, 865 90, 895 135" class="arrow"/>
  <path d="M 710 195 C 710 245, 420 245, 420 195" class="arrow"/>
  <text x="548" y="240" class="detail">工具结果写入 Prompt，返回 MODEL</text>

  <text x="55" y="305" class="name">阻塞状态</text>
  <rect x="55" y="330" width="245" height="82" class="state" fill="#f4edff" stroke="#8557c8"/>
  <text x="94" y="365" class="name">WAITING_FOR_USER</text>
  <text x="91" y="391" class="detail">等待用户补充必要信息</text>
  <rect x="330" y="330" width="245" height="82" class="state" fill="#f4edff" stroke="#8557c8"/>
  <text x="357" y="365" class="name">WAITING_FOR_APPROVAL</text>
  <text x="372" y="391" class="detail">等待工具审批决定</text>
  <rect x="605" y="330" width="245" height="82" class="state" fill="#f4edff" stroke="#8557c8"/>
  <text x="648" y="365" class="name">WAITING_FOR_CHILD</text>
  <text x="652" y="391" class="detail">等待子 AgentTurn 完成</text>
  <rect x="880" y="330" width="265" height="82" class="state" fill="#f4edff" stroke="#8557c8"/>
  <text x="930" y="365" class="name">RETRY_SCHEDULED</text>
  <text x="925" y="391" class="detail">等待 nextRunnableAt 到期</text>

  <path d="M 710 195 L 710 330" class="dash"/>
  <path d="M 420 195 C 420 270, 177 270, 177 330" class="dash"/>
  <path d="M 710 195 C 710 270, 452 270, 452 330" class="dash"/>
  <path d="M 710 195 C 710 270, 1012 270, 1012 330" class="dash"/>
  <path d="M 177 412 C 177 470, 420 470, 420 195" class="dash"/>
  <path d="M 452 412 C 452 455, 710 455, 710 195" class="dash"/>

  <text x="55" y="505" class="name">其他终止状态</text>
  <rect x="55" y="530" width="205" height="70" class="state" fill="#fff0f0" stroke="#c75656"/>
  <text x="126" y="572" class="name">FAILED</text>
  <rect x="280" y="530" width="205" height="70" class="state" fill="#fff0f0" stroke="#c75656"/>
  <text x="334" y="572" class="name">CANCELLED</text>
  <rect x="505" y="530" width="285" height="70" class="state" fill="#fff0f0" stroke="#c75656"/>
  <text x="542" y="572" class="name">MAX_ITERATIONS_REACHED</text>
  <rect x="810" y="530" width="335" height="70" class="state" fill="#fff0f0" stroke="#c75656"/>
  <text x="902" y="572" class="name">BUDGET_EXCEEDED</text>
</svg>
